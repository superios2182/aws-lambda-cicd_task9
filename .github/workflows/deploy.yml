name: Deploy Lambdas to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy createOrder
        run: |
          cd lambdas/cmtr_ngt8zi57_lambda_createOrder
          zip -r code.zip .
          aws lambda update-function-code --function-name cmtr_ngt8zi57_lambda_createOrder --zip-file fileb://code.zip
          aws lambda update-function-configuration --function-name cmtr_ngt8zi57_lambda_createOrder --handler handler.handler || true

      - name: Deploy reserveStock
        run: |
          cd lambdas/cmtr_ngt8zi57_lambda_reserveStock
          zip -r code.zip .
          aws lambda update-function-code --function-name cmtr_ngt8zi57_lambda_reserveStock --zip-file fileb://code.zip
          aws lambda update-function-configuration --function-name cmtr_ngt8zi57_lambda_reserveStock --handler handler.handler || true

      - name: Deploy sendNotification
        run: |
          cd lambdas/cmtr_ngt8zi57_lambda_sendNotification
          zip -r code.zip .
          aws lambda update-function-code --function-name cmtr_ngt8zi57_lambda_sendNotification --zip-file fileb://code.zip
          aws lambda update-function-configuration --function-name cmtr_ngt8zi57_lambda_sendNotification --handler handler.handler || true
